name: ebpf-lab3
topology:
  nodes:
    h1:
      kind: linux
      image: ubuntu:22.04
      exec: [apt-get update, apt-get install -y iproute2 iputils-ping]
    h2:
      kind: linux
      image: ubuntu:22.04
      exec: [apt-get update, apt-get install -y iproute2 iputils-ping]
    h3:
      kind: linux
      image: ubuntu:22.04
      exec: [apt-get update, apt-get install -y iproute2 iputils-ping]
  links:
    - endpoints: ["h1:eth1", "h2:eth1"]
    - endpoints: ["h1:eth2", "h3:eth1"]